<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老公的樂高帳本</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 26px; color: #d9381e; margin: 0 0 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .stat-card .label { font-size: 13px; color: #666; margin-bottom: 5px; }
        .stat-card .value { font-size: 22px; font-weight: bold; color: #1a1a1a; }
        .card-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: relative; }
        .item-info { flex: 1; }
        .item-title { font-size: 18px; font-weight: bold; color: #111; margin-bottom: 4px; }
        .item-sub { font-size: 13px; color: #777; margin-bottom: 8px; }
        .item-meta { font-size: 13px; color: #555; display: flex; gap: 12px; align-items: center; }
        .item-price { font-size: 20px; font-weight: bold; color: #d9381e; text-align: right; }
        .badge { background: #eef2ff; color: #4f46e5; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .search-bar { margin-bottom: 15px; width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; background: white; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧱 樂高購買紀錄帳本</h1>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">總盒組數量</div>
                <div class="value" id="total-count">0 盒</div>
            </div>
            <div class="stat-card">
                <div class="label">累積購買金額</div>
                <div class="value" id="total-amount" style="color: #d9381e;">$0</div>
            </div>
        </div>

        <input type="text" id="search" class="search-bar" placeholder="🔍 搜尋盒組名稱、編號或地點..." oninput="filterData()">

        <div class="card-list" id="item-container"></div>
    </div>

: "臉書", "series": "Creator", "count": 1}];

        function renderItems(dataList) {
            const container = document.getElementById('item-container');
            container.innerHTML = '';
            
            let totalCount = 0;
            let totalAmount = 0;

            dataList.forEach(item => {
                totalCount += item.count || 1;
                totalAmount += item.buy_price || 0;

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.name}</div>
                        <div class="item-sub">編號: #${item.id} <span class="badge">${item.series || 'LEGO'}</span></div>
                        <div class="item-meta">
                            <span>📅 ${item.date || '未填寫'}</span>
                            <span>📍 ${item.location || '未知'}</span>
                        </div>
                    </div>
                    <div class="item-price">$${(item.buy_price || 0).toLocaleString()}</div>
                `;
                container.appendChild(card);
            });

            document.getElementById('total-count').innerText = totalCount + ' 盒';
            document.getElementById('total-amount').innerText = '$' + totalAmount.toLocaleString();
        }

        function filterData() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = items.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.id.toString().includes(query) ||
                (item.location && item.location.toLowerCase().includes(query)) ||
                (item.series && item.series.toLowerCase().includes(query))
            );
            renderItems(filtered);
        }

        // Initial Render
        renderItems(items);
    </script>
</body>
</html>
