<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>積木收藏帳本</title>
    <!-- 引入 SheetJS 解析 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-number { font-size: 28px; font-weight: bold; color: #d32f2f; margin-top: 5px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .form-row input { flex: 1; min-width: 120px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { background-color: #e53935; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #c62828; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; }
        .search-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 統計數據 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div>總盒組數量</div>
                <div class="stat-number" id="totalCount">0 盒</div>
            </div>
            <div class="stat-card">
                <div>累積購買金額</div>
                <div class="stat-number" id="totalAmount">$0</div>
            </div>
        </div>

        <!-- Excel 匯入 -->
        <div class="card">
            <h3>📁 批次匯入 Excel</h3>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>

        <!-- 單筆新增 (本機顯示) -->
        <div class="card">
            <h3>➕ 新增單筆資料</h3>
            <div class="form-row">
                <input type="text" id="addId" placeholder="盒組編號 (如 10316)">
                <input type="text" id="addName" placeholder="名稱">
                <input type="number" id="addPrice" placeholder="入手金額">
                <input type="text" id="addDate" placeholder="日期 (YYYY/MM/DD)">
                <input type="text" id="addLocation" placeholder="購買地點">
            </div>
            <button onclick="addItem()">新增至列表</button>
        </div>

        <!-- 資料列表與搜尋 -->
        <div class="card">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋盒組名稱、編號..." oninput="renderTable()">
            <table>
                <thead>
                    <tr>
                        <th>編號</th>
                        <th>名稱</th>
                        <th>入手金額</th>
                        <th>日期</th>
                        <th>購買地點</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody">
                    <tr><td colspan="5" style="text-align:center;">請上傳 Excel 檔案或手動新增資料</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    let itemsList = [];

    // 監聽 Excel 檔案上傳
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // 轉成 JSON 陣列
            const json = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            itemsList = json.map(row => {
                let id = '', name = '未命名盒組', price = 0, qty = 1, date = '', location = '';

                // 動態搜尋所有欄位，忽略前後空白與大小寫
                for (let key in row) {
                    const cleanKey = String(key).replace(/\s+/g, ''); // 去除所有空白
                    const val = row[key];

                    // 1. 盒組編號
                    if (cleanKey.includes('盒組編號') || cleanKey === '編號') {
                        id = String(val);
                    }
                    // 2. 盒組名稱
                    else if (cleanKey.includes('盒組名稱') || cleanKey === '名稱') {
                        name = String(val);
                    }
                    // 3. 精準鎖定「入手金額」
                    else if (cleanKey.includes('入手金額')) {
                        let num = parseFloat(String(val).replace(/[^0-9.]/g, ''));
                        if (!isNaN(num)) price = Math.round(num);
                    }
                    // 4. 數量
                    else if (cleanKey === '數量') {
                        let parsedQty = parseInt(val, 10);
                        if (!isNaN(parsedQty) && parsedQty > 0) qty = parsedQty;
                    }
                    // 5. 購買日期
                    else if (cleanKey.includes('購買日期') || cleanKey === '日期') {
                        date = String(val).split('T')[0].replace(/-/g, '/');
                    }
                    // 6. 購買地點
                    else if (cleanKey.includes('購買地點') || cleanKey === '地點') {
                        location = String(val);
                    }
                }

                return {
                    id: id,
                    name: name,
                    price: price,
                    qty: qty,
                    date: date,
                    location: location
                };
            });

            renderTable();
        };
        reader.readAsArrayBuffer(file);
    });

    // 手動新增資料
    function addItem() {
        const id = document.getElementById('addId').value;
        const name = document.getElementById('addName').value;
        const price = Math.round(Number(document.getElementById('addPrice').value) || 0);
        const date = document.getElementById('addDate').value;
        const location = document.getElementById('addLocation').value;

        if (!name) {
            alert("請填寫名稱！");
            return;
        }

        itemsList.unshift({ id, name, price, qty: 1, date, location });
        
        document.getElementById('addId').value = '';
        document.getElementById('addName').value = '';
        document.getElementById('addPrice').value = '';
        document.getElementById('addDate').value = '';
        document.getElementById('addLocation').value = '';

        renderTable();
    }

    // 渲染表格與更新統計數據
    function renderTable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filteredItems = itemsList.filter(item => 
            item.id.toLowerCase().includes(keyword) || 
            item.name.toLowerCase().includes(keyword)
        );

        const tbody = document.getElementById('itemTableBody');
        tbody.innerHTML = '';

        if (filteredItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">無符合資料</td></tr>';
        } else {
            filteredItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name} ${item.qty > 1 ? `<span style="color:#d32f2f; font-weight:bold;">(x${item.qty})</span>` : ''}</td>
                    <td>$${item.price.toLocaleString()}</td>
                    <td>${item.date}</td>
                    <td>${item.location}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 計算總數量與總金額
        const totalCount = itemsList.reduce((sum, item) => sum + item.qty, 0);
        const totalAmount = itemsList.reduce((sum, item) => sum + item.price, 0);

        document.getElementById('totalCount').innerText = `${totalCount} 盒`;
        document.getElementById('totalAmount').innerText = `$${totalAmount.toLocaleString()}`;
    }
</script>
