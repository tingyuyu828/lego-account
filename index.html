<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樂高購買紀錄帳本</title>
    <!-- SheetJS 用於解析 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 26px; color: #d9381e; margin: 0; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-value { font-size: 22px; font-weight: bold; color: #d9381e; margin-top: 5px; }
        .btn { background: #d9381e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #dc2626; }
        .btn:hover { opacity: 0.9; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        .item-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .item-title { font-size: 16px; font-weight: bold; }
        .item-sub { font-size: 13px; color: #666; margin-top: 4px; }
        .item-price { font-size: 18px; font-weight: bold; color: #d9381e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧱 樂高購買紀錄帳本</h1>
        </header>

        <!-- 統計資訊 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div>總盒組數量</div>
                <div class="stat-value" id="total-count">0 盒</div>
            </div>
            <div class="stat-card">
                <div>累積購買金額</div>
                <div class="stat-value" id="total-amount">$0</div>
            </div>
        </div>

        <!-- 匯入與管理區塊 -->
        <div class="card">
            <h3>📁 批次匯入 Excel</h3>
            <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
        </div>

        <div class="card">
            <h3>➕ 新增單筆資料</h3>
            <div class="form-grid">
                <input type="text" id="add-id" placeholder="盒組編號 (如 10316)">
                <input type="text" id="add-name" placeholder="名稱">
                <input type="number" id="add-price" placeholder="入手金額">
                <input type="text" id="add-date" placeholder="日期 (YYYY/MM/DD)">
                <input type="text" id="add-location" placeholder="購買地點">
            </div>
            <button class="btn" style="margin-top:10px; width:100%;" onclick="addSingleItem()">新增至雲端</button>
        </div>

        <input type="text" id="search" placeholder="🔍 搜尋盒組名稱、編號..." oninput="filterData()" style="margin-bottom:15px; padding:12px;">

        <!-- 清單容器 -->
        <div id="item-list">載入中...</div>
    </div>

    <!-- 載入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 已代入您的專屬 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyD1_oCmaGgVTkn4vABJnEGiYmr7mLHSuDE",
            authDomain: "lego-account.firebaseapp.com",
            projectId: "lego-account",
            storageBucket: "lego-account.firebasestorage.app",
            messagingSenderId: "640586279150",
            appId: "1:640586279150:web:3f048ca2c4c32bcb652bff",
            measurementId: "G-XYKYDFZT9V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const legoRef = collection(db, "lego_items");

        let allItems = [];

        // 讀取雲端資料
        async function fetchItems() {
            try {
                const snapshot = await getDocs(legoRef);
                allItems = [];
                snapshot.forEach(docSnap => {
                    allItems.push({ docId: docSnap.id, ...docSnap.data() });
                });
                renderList(allItems);
            } catch (error) {
                console.error("Error fetching docs: ", error);
                document.getElementById('item-list').innerText = "讀取資料失敗，請確認資料庫權限。";
            }
        }

        // 渲染畫面
        window.renderList = function(data) {
            const listDiv = document.getElementById('item-list');
            listDiv.innerHTML = '';
            let totalCount = 0;
            let totalAmount = 0;

            if (data.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">目前尚無樂高資料，請選擇 Excel 匯入或手動新增。</div>';
            }

            data.forEach(item => {
                totalCount += 1;
                totalAmount += Number(item.price || 0);

                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <div>
                        <div class="item-title">${item.name || '未命名'} <span style="font-size:12px; color:#888;">#${item.id}</span></div>
                        <div class="item-sub">📅 ${item.date || '未填'} | 📍 ${item.location || '未填'}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="item-price">$${Number(item.price || 0).toLocaleString()}</div>
                        <button class="btn btn-danger" style="padding:2px 8px; font-size:12px; margin-top:5px;" onclick="deleteItem('${item.docId}')">刪除</button>
                    </div>
                `;
                listDiv.appendChild(div);
            });

            document.getElementById('total-count').innerText = totalCount + ' 盒';
            document.getElementById('total-amount').innerText = '$' + totalAmount.toLocaleString();
        };

        // 搜尋
        window.filterData = function() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = allItems.filter(i => 
                (i.name && i.name.toLowerCase().includes(q)) || 
                (i.id && i.id.toString().includes(q)) ||
                (i.location && i.location.toLowerCase().includes(q))
            );
            renderList(filtered);
        };

        // 手動新增單筆
        window.addSingleItem = async function() {
            const newItem = {
                id: document.getElementById('add-id').value,
                name: document.getElementById('add-name').value,
                price: Number(document.getElementById('add-price').value),
                date: document.getElementById('add-date').value,
                location: document.getElementById('add-location').value
            };
            await addDoc(legoRef, newItem);
            alert('已新增至雲端！');
            fetchItems();
        };

        // 刪除單筆
        window.deleteItem = async function(docId) {
            if (confirm('確定要刪除這筆資料嗎？')) {
                await deleteDoc(doc(db, "lego_items", docId));
                fetchItems();
            }
        };

        // Excel 檔案匯入處理
        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);

                const batch = writeBatch(db);
                json.forEach(row => {
                    const newDoc = doc(legoRef);
                    batch.set(newDoc, {
                        id: row['盒組編號'] || row['編號'] || '',
                        name: row['盒組名稱'] || row['名稱'] || '',
                        price: Number(row['實際購買金額'] || row['金額'] || 0),
                        date: row['購買日期'] || row['日期'] || '',
                        location: row['購買地點'] || row['地點'] || ''
                    });
                });
                await batch.commit();
                alert('Excel 資料已成功同步上傳至雲端！');
                fetchItems();
            };
            reader.readAsArrayBuffer(file);
        });

        // 頁面載入時讀取
        fetchItems();
    </script>
</body>
</html>
